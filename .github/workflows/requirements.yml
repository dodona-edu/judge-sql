name: Requirements

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  requirements-match-image:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dodona-edu/dodona-sqlite:latest
      options: --user root

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check requirements.txt against the image's dependency list
        run: ./devel/requirements_delta.sh
