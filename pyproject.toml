[tool.coverage.run]
omit = [
    ".github/*",
    "htmlcov/*",
    "*/site-packages/*",
    "tests/*",
    "venv/*",
]
source = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/e2e_repos"]
# Keep in step with .tool-versions; ruff defaults to py310 and can't infer it without a [project] table.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "D", "C90", "I", "ERA", "PL", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests don't require docstrings on methods and functions (D102, D103), but docstring formatting rules still apply.
"tests/*" = ["D102", "D103"]
